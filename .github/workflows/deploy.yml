name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile

      - name: Set up ssh access to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
              printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
              strict=yes
          else
              strict=accept-new
          fi
          cat > ~/.ssh/config <<EOF
          Host mikrus
              HostName $SSH_HOST
              User ${SSH_USER:-root}
              Port ${SSH_PORT:-22}
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              StrictHostKeyChecking $strict
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify ssh access
        run: |
          echo "Key the runner will offer:"
          ssh-keygen -lf ~/.ssh/deploy_key
          ssh -o BatchMode=yes mikrus 'echo "logged in as $(id -un)"'

      - name: Deploy
        env:
          DEPLOY_HOST: mikrus
          DEPLOY_SKIP_PUSH: "1"
        run: ./deploy/deploy.sh
