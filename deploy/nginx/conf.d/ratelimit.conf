# Rate limit buckets. These have to live in the http context, which is why they
# are here and not in the server block. The zone is keyed on $binary_remote_addr,
# which is the real visitor only because cloudflare-realip.conf rewrites it.
#
# 10m of shared memory holds roughly 160k addresses.

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=site:10m rate=120r/m;

limit_req_status 429;
limit_req_log_level warn;
